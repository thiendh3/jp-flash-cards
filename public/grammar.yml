- formula: ～というと・～といえば・～といったら
  structure: N + というと／といえば／といったら
  meaning: Nói đến N thì…, nhắc tới N là nghĩ ngay đến…
  example:
    - 日本料理というと、すしを思い浮かべる。
    - 京都といえば、お寺が有名です。
    - 彼の料理のうまさといったら、プロ並みだ。
- formula: ～というより(も)
  structure: N／V／A + というより(も) + B
  meaning: Nói là A thì đúng hơn là B, thay vì A thì nên nói là B
  example:
    - 彼女は先生というより、友達のような存在だ。
    - この部屋は暑いというより、熱いくらいだ。
- formula: ～といっても
  structure: Thể thường + といっても
  meaning: Tuy nói là… nhưng thực ra (không như tưởng tượng)
  example:
    - 料理ができるといっても、卵焼きくらいです。
    - 旅行に行ったといっても、近所の温泉です。
- formula: ～と言われている
  structure: Thể thường + と言われている
  meaning: Người ta nói rằng…, được cho là…
  example:
    - この神社は恋愛にご利益があると言われている。
    - 日本人は働きすぎだと言われている。
- formula: ～ということだ／とのことだ
  structure: Thể thường + ということだ／とのことだ
  meaning: Nghe nói là…, theo như được biết thì… (truyền đạt lại thông tin)
  example:
    - 天気予報によると、明日は雪が降るということだ。
    - 社長は出張中とのことです。
- formula: ～とは
  structure: N／Thể thường + とは
  meaning: Định nghĩa "N là…"; hoặc diễn tả sự ngạc nhiên "thật không ngờ là…"
  example:
    - 「ワークライフバランス」とは、仕事と生活の調和のことだ。
    - 彼が試験に落ちるとは思わなかった。
- formula: ～ところへ・～ところに・〜ところを・〜ところで
  structure: V(辞書形／ている／た) + ところへ／ところに／ところを／ところで
  meaning: Đúng lúc đang… thì (xảy ra việc khác); ところで = nhân tiện, dù có… cũng
  example:
    - 出かけようとしたところへ、友達が来た。
    - 寝ているところを起こされた。
    - 今から走ったところで、間に合わないだろう。
- formula: ～最中に
  structure: V ている／N の + 最中に
  meaning: Đang giữa lúc… thì (có việc bất ngờ xảy ra)
  example:
    - 会議の最中に、電話が鳴った。
    - 食事をしている最中に、停電になった。
- formula: ～ごとに
  structure: N／V辞書形 + ごとに
  meaning: Cứ mỗi…, mỗi một…
  example:
    - 一年ごとに、パスポートの期限を確認する。
    - 5分ごとにバスが来る。
- formula: ～たびに
  structure: V辞書形／N の + たびに
  meaning: Mỗi lần… là lại…
  example:
    - この曲を聞くたびに、故郷を思い出す。
    - 彼は会うたびに背が伸びている。
- formula: ～ことがある
  structure: V辞書形／V ない + ことがある
  meaning: Đôi khi có (xảy ra) việc…
  example:
    - 朝ごはんを食べないことがある。
    - 仕事が忙しくて、帰りが遅くなることがある。
- formula: ～てしかたがない・～てしょうがない
  structure: V て／A い→くて／A な→で + しかたがない／しょうがない
  meaning: …không chịu nổi, …đến mức không thể kiềm chế
  example:
    - 試験の結果が気になってしかたがない。
    - 眠くてしょうがない。
- formula: ～てよかった
  structure: V て + よかった
  meaning: May quá vì đã…, thật tốt là đã…
  example:
    - 早めに出てよかった。電車が遅れていた。
    - この大学に入ってよかったと思う。
- formula: ～てもらってもいいですか
  structure: V て + もらってもいいですか
  meaning: Nhờ (ai) làm giúp… được không ạ? (nhờ vả lịch sự)
  example:
    - すみません、写真を撮ってもらってもいいですか。
    - ちょっとこれを手伝ってもらってもいいですか。
- formula: ～てはじめて
  structure: V て + はじめて
  meaning: Phải sau khi… thì mới (nhận ra, hiểu ra…)
  example:
    - 病気になってはじめて、健康のありがたさがわかった。
    - 親になってはじめて、親の苦労がわかる。
- formula: ～てからでないと・～てからでなければ
  structure: V て + からでないと／からでなければ + V ない／できない
  meaning: Nếu chưa… thì không thể…, phải… rồi mới
  example:
    - 医者に相談してからでないと、薬は飲めません。
    - 全員そろってからでなければ、始められない。
- formula: 〜でしかない
  structure: N + でしかない
  meaning: Chỉ là…, chẳng qua chỉ là… (đánh giá thấp, không hơn được)
  example:
    - 私は、ただの学生でしかない。
    - 彼にとって、それは遊びでしかなかった。
- formula: 〜はもちろん〜も
  structure: N1 + はもちろん + N2 + も
  meaning: N1 thì đương nhiên rồi, ngay cả N2 cũng…
  example:
    - 彼は英語はもちろん、中国語も話せる。
    - この店は、味はもちろん、サービスもいい。
- formula: 〜くらい・ほど〜はない
  structure: N + くらい／ほど + N／V + はない
  meaning: Không có gì… bằng N, N là nhất
  example:
    - 母の料理ほどおいしいものはない。
    - 友達と話すくらい楽しいことはない。
- formula: 〜は〜ほど〜ない
  structure: N1 + は + N2 + ほど + A ない
  meaning: N1 không… bằng N2 (so sánh không bằng)
  example:
    - 今年の夏は去年ほど暑くない。
    - 弟は私ほど背が高くない。
- formula: 〜代わりに
  structure: V辞書形／Nの + 代わりに
  meaning: Thay vì…, thay cho…; bù lại, đổi lại…
  example:
    - 母の代わりに、私が買い物に行った。
    - 手伝ってあげる代わりに、昼ご飯をおごってね。
- formula: 〜わりには
  structure: Thể thường（Nの／Naな） + わりには
  meaning: So với… thì (lại)…, không tương xứng với… (kết quả trái với mong đợi)
  example:
    - 彼は年のわりには若く見える。
    - 値段が高いわりには、あまりおいしくなかった。
- formula: 〜わけだ
  structure: Thể thường（Nの／Naな） + わけだ
  meaning: Thảo nào…, hóa ra là…, tức là… (kết luận hợp lý từ sự việc đã biết)
  example:
    - 彼は10年も日本に住んでいたのか。日本語が上手なわけだ。
    - 一日中歩いたから、疲れるわけだ。
- formula: 〜わけにはいかない
  structure: V辞書形／Vない形 + わけにはいかない
  meaning: Không thể… (vì lý do xã hội, đạo đức); Vない + わけにはいかない = không thể không…
  example:
    - 大事な会議があるので、休むわけにはいかない。
    - 先輩に頼まれたから、やらないわけにはいかない。
- formula: 〜とは限らない
  structure: Thể thường + とは限らない
  meaning: Không hẳn là…, chưa chắc đã… (không phải lúc nào cũng đúng)
  example:
    - 高いものがいいとは限らない。
    - 日本人だからといって、漢字が全部書けるとは限らない。
- formula: 〜わけではない
  structure: Thể thường（Nの／Naな） + わけではない
  meaning: Không phải là…, không có nghĩa là… (phủ định một phần)
  example:
    - 肉が嫌いなわけではないが、あまり食べない。
    - 全然勉強しなかったわけではない。
- formula: 〜に比べて
  structure: N + に比べて／に比べると
  meaning: So với N thì…
  example:
    - 去年に比べて、今年は雨が少ない。
    - 都会に比べると、田舎は物価が安い。
- formula: 〜といい・ばいい・〜たらいい
  structure: V辞書形 + といい／Vば形 + いい／Vた形 + らいい
  meaning: Nên…, …thì tốt (khuyên bảo, đề xuất); mong là… (ước muốn)
  example:
    - 疲れたら、早く寝るといい。
    - わからなければ、先生に聞けばいい。
    - 明日、晴れたらいいなあ。
- formula: 〜ばよかったのに
  structure: Vば形 + よかったのに
  meaning: Giá mà… thì tốt rồi (tiếc nuối, trách nhẹ vì đã không làm)
  example:
    - 来ればよかったのに。とても楽しかったよ。
    - もっと早く言ってくれればよかったのに。
- formula: 〜（で）さえ
  structure: N（＋で／に／から…） + さえ
  meaning: Ngay cả…, đến cả… (nêu ví dụ cực đoan để nhấn mạnh)
  example:
    - この問題は小学生でさえ解ける。
    - 忙しくて、昼ご飯を食べる時間さえない。
- formula: 〜さえ〜ば
  structure: N + さえ + Vば形／Vます形 + さえすれば／Aくさえあれば／Nでさえあれば
  meaning: Chỉ cần… là… (điều kiện tối thiểu đủ để thực hiện)
  example:
    - 薬を飲みさえすれば、すぐ治りますよ。
    - お金さえあれば、何でも買える。
- formula: 〜たって・〜だって
  structure: Vた形／Aくた + って；Na／N + だって
  meaning: Dù có… cũng… (cách nói thân mật của 〜ても／〜でも)
  example:
    - 今から急いだって、間に合わないよ。
    - いくら安くたって、要らないものは買わない。
    - 子どもだって、そのくらいわかる。
- formula: 〜に決まっている
  structure: Thể thường（N／Na） + に決まっている
  meaning: Chắc chắn là…, nhất định là… (khẳng định chủ quan mạnh)
  example:
    - 毎日練習しているから、試合に勝つに決まっている。
    - そんな話、うそに決まっている。
